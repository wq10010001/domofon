<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Умный Домофон</title>
    
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background-color: #f4f6f9; color: #333; margin-top: 80px; }
        h1 { font-size: 28px; margin-bottom: 30px; }
        .btn { background-color: #00ea7f; border: none; color: #111; padding: 25px 50px; font-size: 22px; font-weight: bold; cursor: pointer; border-radius: 50px; box-shadow: 0 10px 20px rgba(0,234,127,0.3); transition: 0.3s; }
        .btn:active { transform: translateY(3px); box-shadow: 0 4px 10px rgba(0,234,127,0.2); background-color: #00c76c; }
    </style>
</vvvhead>
<body>

    <h1>Управление Домофоном</h1>
    <button class="btn" onclick="sendOpenCommand()">ОТКРЫТЬ ДВЕРЬ</button>

    <script>
    
        const mqttHost = 'wss://230c3530dca34ca7bdcecaadeab14fbf.s1.eu.hivemq.cloud:8884/mqtt' 

        function sendOpenCommand() {
            
            const userPassword = prompt("Введите пароль от домофона:");
            
            if (!userPassword) {
                alert("Пароль не введен!");
                return;
            }

            
            const client = mqtt.connect(mqttHost, { 
                username: 'domofon', 
                password: userPassword 
            });

            
            client.on('error', function(err) {
                alert('Неверный пароль!');
                client.end();
            });

            
            client.on('connect', function () {
                client.publish('home/domofon/open', '1', { qos: 1 }, function() {
                    alert('Дверь открывается!');
                    client.end(); 
                });
            });
        }
    </script>
</body>
</html>
