<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Умный Домофон</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background-color: #f4f6f9; color: #333; margin-top: 80px; }
        h1 { font-size: 28px; margin-bottom: 30px; }
        .btn { background-color: #00ea7f; border: none; color: #111; padding: 25px 50px; font-size: 22px; font-weight: bold; cursor: pointer; border-radius: 50px; box-shadow: 0 10px 20px rgba(0,234,127,0.3); transition: 0.3s; }
        .btn:active { transform: translateY(3px); box-shadow: 0 4px 10px rgba(0,234,127,0.2); background-color: #00c76c; }
    </style>
</head>
<body>

    <h1>Управление Домофоном</h1>
    <button class="btn" onclick="sendOpenCommand()">ОТКРЫТЬ ДВЕРЬ</button>

    <script>
        
        const securePasswordHash = "5d4cf15281812f2216d79e5f21adf2ae0b372f59a6f2ab5e5a771446630408a2"; 

        
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);                    
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            
            const hashHex = hashArray.map(b => ('0' + b.toString(16)).slice(-2)).join('');
            return hashHex;
        }

        async function sendOpenCommand() {
            const userPassword = prompt("Введите секретный пароль от домофона:");
            
            if (!userPassword) {
                alert("Пароль не введен!");
                return;
            }

            const inputHash = await sha256(userPassword);

            // Проверяем совпадение хэшей
            if (inputHash !== securePasswordHash) {
                alert("❌ Ошибка: Неверный пароль! Доступ отклонен.");
                return; 
            }

            alert("⏳ Пароль верен! Отправка команды на домофон...");

            
            const espIp = "192.168.1.50"; 

            fetch(`http://${espIp}/open`)
                .then(response => {
                    alert("Дверь успешно открывается!");
                })
                .catch(error => {
                    alert("Пароль верен, но нет связи с платой ESP32. Убедитесь, что телефон подключен к тому же Wi-Fi.");
                });
        }
    </script>
</body>
</html>
